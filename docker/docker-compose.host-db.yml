# API + Redis in Docker, PostgreSQL on the host.
# Use when DB (notes_dwh) runs on the host and you want Redis in a container (no need to change host Redis).
#
# Usage (from project root; --env-file .env loads .env from project root):
#   docker compose -f docker/docker-compose.host-db.yml --env-file .env up -d --build
#
# - DB: host via host.docker.internal (requires .env DB_*).
# - Redis: by default the "redis" service in this compose (dedicated to the API). Override in .env:
#   REDIS_HOST_DOCKER=host.docker.internal  → use Redis on the host (must listen on 0.0.0.0 or 172.17.0.1)
#   REDIS_HOST_DOCKER=disabled             → no Redis (in-memory rate limiting)

services:
  redis:
    image: redis:7-alpine
    container_name: osm-notes-api-redis
    restart: unless-stopped
    # No port published to host; only the api service needs access
    command: redis-server --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: osm-notes-api
    ports:
      - '${PORT:-3010}:3000'
    env_file:
      - ../.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-notes_dwh}
      - DB_USER=${DB_USER:-osm_notes_analytics_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSL=${DB_SSL:-true}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-false}
      # Default: use Redis container in this stack. Use REDIS_HOST_DOCKER=host.docker.internal for host Redis, or =disabled for no Redis.
      - REDIS_HOST=${REDIS_HOST_DOCKER:-redis}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - LOG_LEVEL=${LOG_LEVEL:-info}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
