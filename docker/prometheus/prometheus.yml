global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'osm-notes-api'
    environment: 'development'

# Alertmanager configuration (if using Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           # - alertmanager:9093

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # API: first target for host-db (API on host:3010); second for full stack (api:3000 in same compose).
  - job_name: 'osm-notes-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3010']
        labels:
          service: 'api'
          source: 'host'
      - targets: ['api:3000']
        labels:
          service: 'api'
          source: 'compose'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
